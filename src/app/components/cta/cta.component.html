<div class="container py-5 my-5">
    <div
        class="cta-card bg-primary text-white p-4 p-md-5 rounded-4 shadow-lg d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div class="text-center text-md-start mb-4 mb-md-0">
            <h2 class="fw-bold mb-1">{{title}}</h2>
            <p class="mb-0 opacity-75">{{subtitle}}</p>
        </div>
        <a [routerLink]="buttonLink" class="btn btn-light btn-lg rounded-pill px-4 fw-bold shadow-sm">
            {{buttonText}} <i class="bi bi-arrow-right ms-2"></i>
        </a>
    </div>
</div>
