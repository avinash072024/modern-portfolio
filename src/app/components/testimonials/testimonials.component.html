<section class="py-5 bg-body-tertiary overflow-hidden">
    <div class="container text-center mb-5" data-aos="fade-up">
        <h6 class="text-primary fw-bold text-uppercase">Testimonials</h6>
        <h2 class="display-6 fw-bold">What Clients Say</h2>
    </div>

    <div class="container">
    <div class="testimonial-track">
        <div class="testimonial-slide" *ngFor="let item of [1,2,3,4,5,6]">
            <div class="card border-0 shadow-sm rounded-5 p-4 m-3 h-100">
                <div class="d-flex align-items-center mb-3">
                    <div class="avatar me-3">
                        <i class="bi bi-person-circle fs-1 text-primary"></i>
                    </div>
                    <div class="text-start">
                        <h6 class="mb-0 fw-bold">Client Name</h6>
                        <small class="text-muted">CEO, Tech Corp</small>
                    </div>
                </div>
                <p class="text-secondary italic mb-0 small">"Avinash is an exceptional developer. His attention to
                    detail in the Angular architecture and theme implementation was top-notch."</p>
                <div class="mt-3 text-start text-warning">
                    <i class="bi bi-star-fill" *ngFor="let s of [1,2,3,4,5]"></i>
                </div>
            </div>
        </div>
    </div>
    </div>
</section>
